name: CI / CD - Bot Service

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate-and-test:
    name: Lint, Type-Check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bot Service
        uses: actions/checkout@v4
        with:
          path: repo/services/bot
          fetch-depth: 0

      - name: Checkout Shared Contracts
        uses: actions/checkout@v4
        with:
          repository: Lotso-trading/shared
          path: repo/packages/shared
          ref: ${{ github.ref_name == 'main' && 'main' || 'develop' }}

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint (Biome)
        working-directory: repo/services/bot
        run: deno task lint

      - name: Type-Check (deno check)
        working-directory: repo/services/bot
        run: deno task check

      - name: Run Unit Tests
        working-directory: repo/services/bot
        run: deno task test

      - name: Validate Deno Cache & Dependencies
        working-directory: repo/services/bot
        run: deno cache src/main.ts

  release:
    name: Release & Changelog
    needs: validate-and-test
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'develop')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bot Service
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 1. Branche develop : Pre-release avec tous les détails des commits
      - name: Develop Pre-Release
        if: github.ref_name == 'develop'
        run: |
          VERSION=$(node -e 'const j=require("./deno.json"); console.log(j.version || "1.0.0")')
          BUILD=$(node -e 'const j=require("./deno.json"); console.log(j.build || "1")')
          TAG="v${VERSION}-develop.${BUILD}"
          echo "📦 Creating Develop Pre-Release: $TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --prerelease || echo "Release $TAG already exists, skipping."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Branche main : Semantic-Release officiel
      - name: Semantic Release on Main
        if: github.ref_name == 'main'
        run: |
          npx --yes \
            -p semantic-release@^24.2.0 \
            -p @semantic-release/github@^11.0.0 \
            -p conventional-changelog-conventionalcommits@^8.0.0 \
            semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
